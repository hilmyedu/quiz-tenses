<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis Rumus Tenses</title>
<style>
:root{--bg:#e9e2d2;--sheet:#fbf8f1;--ink:#1c2540;--mu:#6f6a5c;--ln:#d8d0bb;--ac:#c8431f;--ok:#1f7a46;--okb:#dff1e2;--no:#b3261e;--nob:#fbdcd6;--chs:75%;--chl:84%;--cht:22%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--sheet:#1b1e28;--ink:#ece7da;--mu:#9a9788;--ln:#323645;--ac:#ff7a59;--ok:#7fd9a0;--okb:#173324;--no:#ff9b92;--nob:#3b1b19;--chs:45%;--chl:27%;--cht:88%}}
:root[data-theme="dark"]{--bg:#12141b;--sheet:#1b1e28;--ink:#ece7da;--mu:#9a9788;--ln:#323645;--ac:#ff7a59;--ok:#7fd9a0;--okb:#173324;--no:#ff9b92;--nob:#3b1b19;--chs:45%;--chl:27%;--cht:88%}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{background:var(--bg);color:var(--ink)}
body{min-height:100%;display:flex;justify-content:center;padding:18px 14px}
.app{width:100%;max-width:720px;background:var(--sheet);border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ln);align-self:flex-start}
.hd{padding:22px 24px 0;border-bottom:2px solid var(--ink)}
.kick{font:600 .72rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:2rem;line-height:1.1;margin:6px 0 4px}
.hd p{color:var(--mu);font-size:.9rem}
.tabs{display:flex;gap:22px;margin-top:18px}
.tabs button{border:0;background:none;color:var(--mu);font-size:.95rem;font-weight:600;padding:8px 0 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-color:var(--ac)}
.pg{padding:24px}
h3{font:600 .72rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:22px 0 10px}
h3:first-child{margin-top:0}
.seg{display:grid;gap:10px}.seg.two{grid-template-columns:1fr 1fr}
@media(max-width:520px){.seg.two{grid-template-columns:1fr}}
.seg button,.opt,.btn{font-size:1rem;border:2px solid var(--ln);background:var(--sheet);color:var(--ink);border-radius:6px;padding:12px 14px;cursor:pointer;text-align:left;transition:transform .1s,box-shadow .1s,border-color .1s}
.seg button:hover{border-color:var(--ink)}
.seg button.on{border-color:var(--ink);box-shadow:3px 3px 0 var(--ac)}
.seg b{display:block;font-size:.98rem}
.seg small{display:block;color:var(--mu);font-size:.8rem;margin-top:4px}
.btn{background:var(--ink);color:var(--sheet);border-color:var(--ink);box-shadow:3px 3px 0 var(--ac);text-align:center;font-weight:700;width:100%;margin-top:22px;padding:14px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ac)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:3px 3px 0 var(--ln)}
.hide{display:none!important}
.top{display:flex;justify-content:space-between;font:.8rem ui-monospace,Menlo,Consolas,monospace;color:var(--mu);margin-bottom:8px}
.top .cb{color:var(--ac);font-weight:700}
.ticks{display:flex;gap:3px;margin-bottom:24px}
.ticks i{flex:1;height:7px;background:var(--ln)}.ticks i.d{background:var(--ink)}.ticks i.c{background:var(--ac)}
.lab{display:flex;gap:8px;margin-bottom:10px}
.lab span{font:700 .68rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:2px solid var(--ink);border-radius:4px}
.q{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:2rem;font-weight:700;line-height:1.15;margin-bottom:20px}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:center;animation:in .25s both}
.opt:nth-child(2){animation-delay:.04s}.opt:nth-child(3){animation-delay:.08s}.opt:nth-child(4){animation-delay:.12s}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
.opt i{flex:none;font:700 .8rem ui-monospace,Menlo,Consolas,monospace;color:var(--mu);width:18px;font-style:normal}
.opt:not(:disabled):hover{border-color:var(--ink);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opt:disabled{cursor:default}
.f{display:inline-flex;flex-wrap:wrap;gap:6px 7px;align-items:center;font:600 .95rem ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.f .sp{color:var(--mu);font-weight:400}
.f .t{padding:2px 8px;border-radius:4px;background:hsl(var(--h) var(--chs) var(--chl));color:hsl(var(--h) 70% var(--cht))}
.f .x{padding:1px 8px;border:2px dashed var(--mu);border-radius:4px;color:var(--mu)}
.v1{--h:205}.v2{--h:34}.v3{--h:142}.vi{--h:338}.vb{--h:266}
.note{margin-top:16px;font-size:.85rem;color:var(--mu);padding:12px 14px;border-left:4px solid var(--ac);background:var(--bg)}
.note .f{display:flex;margin-top:6px;color:var(--ink)}
.big{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:4rem;font-weight:700;line-height:1}
.cards{display:grid;grid-template-columns:repeat(2,1fr);border-top:2px solid var(--ink);border-left:1px solid var(--ln)}
.sc{padding:14px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.sc span{font:.7rem ui-monospace,Menlo,Consolas,monospace;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.sc strong{display:block;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:1.9rem;margin-top:2px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:.9rem}
.row .nm{font-weight:600}.row .rt{color:var(--mu);font:.78rem ui-monospace,Menlo,Consolas,monospace;text-align:right}
.row .pb{grid-column:1/3;height:5px;background:var(--ln);margin-top:5px}
.row .pb i{display:block;height:100%}
.tag{font:700 .62rem ui-monospace,Menlo,Consolas,monospace;padding:2px 6px;margin-left:8px;border:2px solid var(--ok);color:var(--ok);border-radius:3px;vertical-align:middle;letter-spacing:.06em}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);font-size:.9rem}
.hist small{display:block;color:var(--mu);font-size:.78rem;margin-top:2px}
.wl{margin-top:20px;display:grid;gap:10px}
.wl div{border:2px solid var(--ln);border-radius:6px;padding:10px 12px;font-weight:600;font-size:.92rem}
.wl .f{display:flex;margin-top:6px}
.sum{margin-top:18px;color:var(--mu);font-size:.92rem}
.empty{color:var(--mu);font-size:.9rem}
</style>
</head>
<body>
<div class="app">
<div class="hd">
  <div class="kick">Chapter 4 · Tenses</div>
  <h1>Kuis Rumus Tenses</h1>
  <p>Susun rumusnya sampai hafal. Progresmu tersimpan di browser ini.</p>
  <div class="tabs"><button id="tabP" class="on">Latihan</button><button id="tabS">Rekam Jejak</button></div>
</div>

<div class="pg" id="start">
  <h3>Mode soal</h3>
  <div class="seg two" id="modeSeg">
    <button data-v="gab" class="on"><b>Rumus Gabungan</b><small>Past Continuous → <span class="f" data-s="×">V2 × Be × V-ing</span></small></button>
    <button data-v="jadi"><b>Rumus Jadi</b><small>Past Continuous → <span class="f" data-s="+">Was/Were + V-ing</span></small></button>
  </div>
  <h3>Cakupan</h3>
  <div class="seg" id="scopeSeg">
    <button data-v="act" class="on"><b>16 tenses Active</b><small>1 sampai 4 unsur</small></button>
    <button data-v="pas"><b>16 tenses Passive</b><small>Ditambah Be V3, sampai 5 unsur</small></button>
    <button data-v="all"><b>Semua, 32 soal</b><small>Active dan Passive dicampur</small></button>
    <button data-v="weak"><b>Fokus yang belum hafal</b><small>Soal yang belum benar 3 kali berturut-turut</small></button>
  </div>
  <button class="btn" id="go">Mulai</button>
</div>

<div class="pg hide" id="quiz">
  <div class="top"><span id="prog"></span><span class="cb" id="combo"></span><span id="sc"></span></div>
  <div class="ticks" id="ticks"></div>
  <div class="lab" id="chips"></div>
  <div class="q" id="qname"></div>
  <div class="opts" id="opts"></div>
  <div class="note hide" id="note"></div>
  <button class="btn hide" id="next">Lanjut</button>
</div>

<div class="pg hide" id="res">
  <h3>Hasil sesi</h3>
  <div class="big" id="final"></div>
  <p class="sum" id="evalt"></p>
  <div class="wl" id="wl"></div>
  <button class="btn" id="again">Ulangi dari awal, diacak lagi</button>
  <button class="btn alt hide" id="redo">Ulangi yang salah saja</button>
  <button class="btn alt" id="toStats">Lihat rekam jejak</button>
</div>

<div class="pg hide" id="stats">
  <h3>Mode</h3>
  <div class="seg two" id="statSeg">
    <button data-v="gab" class="on"><b>Gabungan</b></button>
    <button data-v="jadi"><b>Rumus Jadi</b></button>
  </div>
  <h3>Ringkasan</h3>
  <div class="cards" id="cards"></div>
  <h3>Per tenses, terlemah dulu</h3>
  <div id="rows"></div>
  <h3>Riwayat sesi terakhir</h3>
  <div id="hist"></div>
  <button class="btn alt" id="wipe">Hapus rekam jejak</button>
</div>
</div>

<script>
const TIMES=["Present","Past","Future","Past Future"];
const TCOL={"Present":"#0e7fb8","Past":"#c9820a","Future":"#1f9d63","Past Future":"#8a4bd0"};
const ASP=[{n:"Simple",p:0,c:0},{n:"Continuous",p:0,c:1},{n:"Perfect",p:1,c:0},{n:"Perfect Continuous",p:1,c:1}];
const TC={"Present":"V1/Vs","Past":"V2","Future":"Will × Vbi","Past Future":"V2 × Will × Vbi"};
const HAVE={bi:"Have",v1:"Have/Has",v2:"Had",v3:"Had",ing:"Having"};
const BE={bi:"Be",v1:"Is/Am/Are",v2:"Was/Were",v3:"Been",ing:"Being"};
const MAIN={bi:"Vbi",v1:"V1/Vs",v2:"V2",v3:"V3",ing:"V-ing"};
const VC={"V1/Vs":"v1","V2":"v2","V3":"v3","V-ing":"vi","Vbi":"vb"};

function nameOf(t,a,pas){return(a.n==="Simple"?"Simple "+t:t+" "+a.n)+(pas?" Passive":"")}
function gabungan(t,a,pas){
  const o=[];
  if(a.n==="Simple")o.push("x");
  o.push(TC[t]);
  if(a.p)o.push("Have × V3");
  if(a.c)o.push("Be × V-ing");
  if(pas)o.push("Be × V3");
  return o.join(" × ");
}
function jadi(t,a,pas){
  const items=[];
  if(a.p)items.push("have");
  if(a.c)items.push("becont");
  if(pas)items.push("bepass");
  items.push("main");
  const out=[];let req;
  if(t==="Future"){out.push("Will");req="bi"}
  else if(t==="Past Future"){out.push("Would");req="bi"}
  else req=t==="Present"?"v1":"v2";
  for(const k of items){
    if(k==="have"){out.push(HAVE[req]);req="v3"}
    else if(k==="becont"){out.push(BE[req]);req="ing"}
    else if(k==="bepass"){out.push(BE[req]);req="v3"}
    else out.push(MAIN[req]);
  }
  return out.join(" + ");
}
const ALL=[];
for(const pas of [0,1])for(const t of TIMES)for(const a of ASP)
  ALL.push({name:nameOf(t,a,pas),t,pas,gab:gabungan(t,a,pas),jadi:jadi(t,a,pas)});

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const toks=s=>new Set(s.split(/[\s+×]+/).filter(Boolean));
function sim(a,b){const x=toks(a),y=toks(b);let i=0;x.forEach(v=>{if(y.has(v))i++});return i/(x.size+y.size-i)}

/* tampilkan rumus: token V diberi warna */
function fx(el,str,sep){
  el.textContent="";el.classList.add("f");
  str.split(" "+sep+" ").forEach((p,i)=>{
    if(i){const s=document.createElement("span");s.className="sp";s.textContent=sep;el.appendChild(s)}
    const e=document.createElement("span");e.textContent=p;
    if(VC[p])e.className="t "+VC[p];
    else if(p==="x")e.className="x";
    el.appendChild(e);
  });
  return el;
}
const sepOf=m=>m==="gab"?"×":"+";
document.querySelectorAll(".f[data-s]").forEach(e=>fx(e,e.textContent,e.dataset.s));

/* ---------- rekam jejak ---------- */
const KEY="kuisTenses.v1";
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.rec)return d}catch(e){}return{rec:{},hist:[],days:[]}}
let DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const mastered=r=>!!r&&r.h.length>=3&&r.h.slice(-3)==="111";
function record(name,ok){
  const k=mode+"|"+name;
  const r=DB.rec[k]||(DB.rec[k]={a:0,c:0,h:""});
  r.a++;if(ok)r.c++;r.h=(r.h+(ok?1:0)).slice(-8);
  const t=ds(new Date());if(!DB.days.includes(t))DB.days.push(t);
  save();
}
function streakDays(){
  const set=new Set(DB.days);let d=new Date();
  if(!set.has(ds(d)))d.setDate(d.getDate()-1);
  let n=0;while(set.has(ds(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* ---------- kuis ---------- */
let mode="gab",scope="act",smode="gab",queue=[],idx=0,score=0,combo=0,wrong=[],locked=false,cur=null,label="";
function seg(id,cb){
  $(id).addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    [...$(id).children].forEach(c=>c.classList.remove("on"));
    b.classList.add("on");cb(b.dataset.v);
  });
}
seg("modeSeg",v=>mode=v);
seg("scopeSeg",v=>scope=v);
seg("statSeg",v=>{smode=v;renderStats()});

function view(id){
  ["start","quiz","res","stats"].forEach(x=>$(x).classList.toggle("hide",x!==id));
  $("tabP").classList.toggle("on",id!=="stats");
  $("tabS").classList.toggle("on",id==="stats");
}
function pool(){
  if(scope==="weak"){
    const w=ALL.filter(q=>!mastered(DB.rec[mode+"|"+q.name]));
    return w.length?w:ALL;
  }
  return ALL.filter(q=>scope==="all"||(scope==="pas")===!!q.pas);
}
const SL={act:"16 Active",pas:"16 Passive",all:"Semua",weak:"Fokus lemah",ulang:"Ulang salah"};
function start(list,lb){
  label=lb||scope;
  queue=shuffle(list||pool());idx=0;score=0;combo=0;wrong=[];
  const tk=$("ticks");tk.innerHTML="";
  queue.forEach(()=>tk.appendChild(document.createElement("i")));
  view("quiz");show();
}
function setCombo(){$("combo").textContent=combo>=3?"beruntun "+combo:""}
function show(){
  locked=false;cur=queue[idx];
  $("prog").textContent="Soal "+(idx+1)+" / "+queue.length;
  $("sc").textContent="Benar "+score;
  setCombo();
  [...$("ticks").children].forEach((t,i)=>{t.className=i<idx?"d":i===idx?"c":""});
  $("qname").textContent=cur.name;
  const ch=$("chips");ch.innerHTML="";
  const c1=document.createElement("span");c1.style.color=TCOL[cur.t];c1.style.borderColor=TCOL[cur.t];c1.textContent=cur.t;ch.appendChild(c1);
  if(cur.pas){const c2=document.createElement("span");c2.style.color="var(--no)";c2.style.borderColor="var(--no)";c2.textContent="Passive";ch.appendChild(c2)}
  $("note").classList.add("hide");$("next").classList.add("hide");
  const ans=cur[mode];
  const others=ALL.filter(q=>q[mode]!==ans).map(q=>({s:q[mode],w:sim(ans,q[mode])+Math.random()*.25}));
  const seen=new Set([ans]),d=[];
  others.sort((a,b)=>b.w-a.w);
  for(const o of others){if(!seen.has(o.s)){seen.add(o.s);d.push(o.s)}if(d.length===3)break}
  const box=$("opts");box.innerHTML="";
  shuffle([ans,...d]).forEach((o,i)=>{
    const b=document.createElement("button");b.className="opt";b.dataset.val=o;
    const k=document.createElement("i");k.textContent=i+1;
    const t=document.createElement("span");fx(t,o,sepOf(mode));
    b.append(k,t);b.onclick=()=>pick(b,o);box.appendChild(b);
  });
}
function pick(btn,val){
  if(locked)return;locked=true;
  const ans=cur[mode],ok=val===ans;
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.dataset.val===ans)b.classList.add("ok")});
  if(ok){score++;combo++}else{btn.classList.add("no");wrong.push(cur);combo=0}
  record(cur.name,ok);
  $("sc").textContent="Benar "+score;setCombo();
  const om=mode==="gab"?"jadi":"gab";
  const n=$("note");n.textContent=mode==="gab"?"Rumus jadi":"Gabungan";
  n.appendChild(fx(document.createElement("div"),cur[om],sepOf(om)));
  n.classList.remove("hide");
  $("next").textContent=idx===queue.length-1?"Lihat hasil":"Lanjut";
  $("next").classList.remove("hide");
}
function next(){if(!locked)return;idx++;idx<queue.length?show():finish()}
function finish(){
  DB.hist.unshift({t:Date.now(),m:mode,s:label,sc:score,n:queue.length});
  DB.hist=DB.hist.slice(0,50);save();
  view("res");
  const p=score/queue.length;
  $("final").textContent=score+" / "+queue.length;
  $("evalt").textContent=p===1?"Sempurna. Ulangi dengan urutan baru supaya benar-benar hafal."
    :p>=.7?"Sudah bagus. Ulangi yang salah sampai habis.":"Terus ulang, urutan soal dan pilihan diacak lagi.";
  const wl=$("wl");wl.innerHTML="";
  wrong.forEach(q=>{
    const d=document.createElement("div");d.textContent=q.name;
    d.appendChild(fx(document.createElement("div"),q[mode],sepOf(mode)));wl.appendChild(d);
  });
  $("redo").classList.toggle("hide",!wrong.length);
}

/* ---------- halaman rekam jejak ---------- */
function renderStats(){
  let a=0,c=0;
  Object.keys(DB.rec).forEach(k=>{if(k.startsWith(smode+"|")){a+=DB.rec[k].a;c+=DB.rec[k].c}});
  const hafal=ALL.filter(q=>mastered(DB.rec[smode+"|"+q.name])).length;
  const data=[["Sesi selesai",DB.hist.length],["Akurasi",a?Math.round(c/a*100)+"%":"-"],["Streak hari",streakDays()],["Hafal",hafal+" / "+ALL.length]];
  const cards=$("cards");cards.innerHTML="";
  data.forEach(([l,v])=>{
    const d=document.createElement("div");d.className="sc";
    const s=document.createElement("span");s.textContent=l;
    const g=document.createElement("strong");g.textContent=v;
    d.append(s,g);cards.appendChild(d);
  });
  const rows=ALL.map(q=>({q,r:DB.rec[smode+"|"+q.name]}));
  rows.sort((x,y)=>(x.r?x.r.c/x.r.a:2)-(y.r?y.r.c/y.r.a:2));
  const box=$("rows");box.innerHTML="";
  rows.forEach(({q,r})=>{
    const pc=r?Math.round(r.c/r.a*100):0;
    const row=document.createElement("div");row.className="row";
    const nm=document.createElement("div");nm.className="nm";nm.textContent=q.name;
    if(mastered(r)){const t=document.createElement("span");t.className="tag";t.textContent="HAFAL";nm.appendChild(t)}
    const rt=document.createElement("div");rt.className="rt";rt.textContent=r?r.c+"/"+r.a+" ("+pc+"%)":"belum dicoba";
    const pb=document.createElement("div");pb.className="pb";
    const i=document.createElement("i");i.style.width=pc+"%";i.style.background=pc>=80?"var(--ok)":pc>=50?"#c9820a":"var(--no)";
    pb.appendChild(i);row.append(nm,rt,pb);box.appendChild(row);
  });
  const h=$("hist");h.innerHTML="";
  if(!DB.hist.length){const e=document.createElement("div");e.className="empty";e.textContent="Belum ada sesi. Selesaikan satu kuis dulu.";h.appendChild(e)}
  DB.hist.slice(0,10).forEach(x=>{
    const d=document.createElement("div");d.className="hist";
    const l=document.createElement("div");
    l.textContent=(x.m==="gab"?"Gabungan":"Rumus Jadi")+" · "+(SL[x.s]||x.s);
    const sm=document.createElement("small");
    sm.textContent=new Date(x.t).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    l.appendChild(sm);
    const r=document.createElement("strong");r.textContent=x.sc+"/"+x.n;
    d.append(l,r);h.appendChild(d);
  });
}
let wipeArmed=false;
$("wipe").onclick=()=>{
  if(!wipeArmed){wipeArmed=true;$("wipe").textContent="Yakin? Klik sekali lagi untuk menghapus";return}
  DB={rec:{},hist:[],days:[]};save();wipeArmed=false;$("wipe").textContent="Hapus rekam jejak";renderStats();
};

$("go").onclick=()=>start();
$("next").onclick=next;
$("again").onclick=()=>start(queue.slice(),label);
$("redo").onclick=()=>start(wrong.slice(),"ulang");
$("tabP").onclick=()=>view("start");
$("tabS").onclick=()=>{smode=mode;[...$("statSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.v===smode));renderStats();view("stats")};
$("toStats").onclick=()=>$("tabS").click();
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hide"))return;
  if(e.key>="1"&&e.key<="4"&&!locked){const b=$("opts").children[+e.key-1];if(b)b.click()}
  else if(e.key==="Enter"&&locked)next();
});
</script>
</body>
</html>
